<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linxicon PT-BR</title>
    <!-- Importando a biblioteca Vis.js para desenhar os grafos -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }

        #grafo-jogo {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            background-color: white;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #controles {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

    <h2>Linxicon: Desafio Diário</h2>
    <div id="grafo-jogo"></div>

    <div id="controles">
        <input type="text" id="input-palavra" placeholder="Digite uma palavra associada..." autocomplete="off">
        <button onclick="tentarPalavra()">Conectar</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
